name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Upload to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    defaults:
      run:
        working-directory: sdk

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build hatchling

      - name: Build sdist and wheel
        run: python -m build

      - name: Inspect distribution skill payloads
        run: >-
          python ../.github/scripts/check-distribution-contents.py
          dist/*.whl dist/*.tar.gz

      - name: Generate SBOM (CycloneDX JSON)
        # SBOM for Python releases (#147). cyclonedx-bom is a CI-only tool,
        # not a packaged dependency. Install the release wheel so the SBOM
        # reflects the resolved release environment, with pyproject.toml as
        # the root component. Fails closed: any failure here blocks the PyPI
        # publish step below.
        run: |
          set -euo pipefail
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          pip install dist/*.whl cyclonedx-bom
          cyclonedx-py environment \
            --pyproject pyproject.toml \
            --mc-type library \
            --output-reproducible \
            --output-format JSON \
            --output-file "dist/mycelium-runtime-${VERSION}-sbom.cyclonedx.json"
          python -c "import json; d=json.load(open('dist/mycelium-runtime-${VERSION}-sbom.cyclonedx.json')); assert d.get('bomFormat')=='CycloneDX', d.get('bomFormat'); c=d.get('metadata',{}).get('component',{}); assert c.get('name')=='mycelium-runtime', c; assert c.get('version')=='${VERSION}', c"

      - name: Upload SBOM to GitHub Release
        # Attach the SBOM to the tag's GitHub Release (#147). Skipped on
        # manual workflow_dispatch without a tag. --clobber keeps re-runs
        # idempotent.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          gh release upload "${GITHUB_REF_NAME}" "dist/mycelium-runtime-${VERSION}-sbom.cyclonedx.json" --clobber

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: sdk/dist/