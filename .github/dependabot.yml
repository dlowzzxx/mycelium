version: 2

updates:
  # ── Python dependencies under sdk/ ────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/sdk"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    # Group compatible dev/test dependency updates to reduce noise.
    # Runtime dependency updates remain separate so behaviour changes are visible.
    groups:
      dev-dependencies:
        dependency-type: "development"
        patterns:
          - "ruff"
          - "pytest*"
          - "coverage*"
          - "mypy*"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    # Security updates are not grouped and are always shown individually.

  # ── GitHub Actions ─────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
